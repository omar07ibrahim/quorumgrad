d -213/7000</text><text x="48" y="500" fill="#26344e" font-size="12" font-weight="700">step.norm</text><rect x="245" y="481" width="430" height="22" rx="11" fill="#e7ebf3"/><rect x="245" y="481" width="284" height="22" rx="11" fill="#20a58f"/><text x="695" y="500" fill="#172337" font-size="12" font-weight="800">Δ 63/220</text><text x="855" y="500" fill="#64748b" font-size="11">mean -93/440 → trimmed 3/40</text>
<text x="48" y="579" fill="#64748b" font-size="13">Maximum absolute shift 119/275 at encoder.bias; one synthetic round, not a convergence claim.</text>
